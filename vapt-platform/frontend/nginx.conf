server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy /api to the backend container. Using an upstream so nginx
  # resolves the DNS name once (and gracefully handles container restarts).
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 50m;  # ingestion uploads
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Security headers
  add_header X-Content-Type-Options nosniff;
  # SAMEORIGIN (not DENY) so the in-app preview modal can embed the
  # /api/v1/reports/{rid}/preview.pdf response. Clickjacking from
  # external sites is still blocked — only same-origin framing allowed.
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy no-referrer;
}
