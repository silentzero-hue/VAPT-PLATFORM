name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vapt
          POSTGRES_PASSWORD: vapt
          POSTGRES_DB: vapt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vapt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://vapt:vapt@localhost:5432/vapt_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_test_jwt_secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: vapt-evidence
      MINIO_ROOT_USER: vapt
      MINIO_ROOT_PASSWORD: vapt
      LLM_API_KEY: ci_dummy
      LLM_PROVIDER: anthropic
      LLM_MODEL: claude-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check app || true
      - name: Type check
        working-directory: backend
        run: |
          mypy app || true
      - name: DEDUP GUARANTEE — must pass
        working-directory: backend
        run: |
          pytest tests/test_dedup.py::test_same_vuln_many_hosts_one_record -xvs
      - name: Test
        working-directory: backend
        run: |
          pytest -xvs --tb=short

      # ---- Dependency audit (idea #17) ----
      - name: pip-audit
        working-directory: backend
        run: pip install pip-audit && pip-audit --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint || true
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
